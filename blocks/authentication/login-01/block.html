<main class="grid min-h-svh place-items-center bg-background px-5 py-12 text-foreground">
  <div class="w-full max-w-[26rem]">
    <div class="inline-flex items-center gap-3 text-[.8rem] font-bold uppercase tracking-[.16em]" aria-label="Acme">
      <span class="grid size-10 place-items-center rounded-xl bg-primary text-xl text-primary-foreground" aria-hidden="true"><svg viewBox="0 0 24 24" width="1.1em" height="1.1em" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 21 20H3Z"/><path d="M8 14.5h8"/></svg></span>
      <span>Acme</span>
    </div>
    <header class="mt-12 mb-8 sm:mt-18">
      <h1 class="mb-3 text-4xl leading-tight font-semibold tracking-tighter sm:text-[2.75rem]">Welcome back.</h1>
      <p class="text-muted-foreground">Sign in to pick up where your team left off.</p>
    </header>
    <form class="grid gap-6" action="/login" method="post">
      <div role="group" class="field">
        <label for="login-01-email">Work email</label>
        <input class="input w-full" id="login-01-email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required>
      </div>
      <div role="group" class="field">
        <label for="login-01-password">Password</label>
        <input class="input w-full" id="login-01-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div role="group" class="field" data-orientation="horizontal">
        <input class="input" id="login-01-remember" name="remember" type="checkbox" value="yes">
        <label for="login-01-remember">Keep me signed in</label>
      </div>
      <button class="btn w-full" type="submit">Sign in</button>
    </form>
    <p class="mt-10 border-t pt-6 text-sm text-muted-foreground">New to Acme? <a class="text-foreground underline underline-offset-4" href="/signup">Create an account</a></p>
  </div>
</main>
